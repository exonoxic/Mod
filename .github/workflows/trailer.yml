name: Trailer

# Films the trailer in the real game (client/dev/Trailer) under a virtual display, mixes its
# soundtrack (tools/trailer_mix.py) and commits the video to docs/trailer on the same branch.
on:
  push:
    paths:
      - 'src/main/java/com/exonoxic/palimpsest/client/dev/Trailer*.java'
      - 'src/main/java/com/exonoxic/palimpsest/client/dev/TitleCardScreen.java'
      - 'tools/trailer_mix.py'
      - '.github/workflows/trailer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trailer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri ffmpeg > /dev/null
          pip install -q numpy

      - name: Film
        timeout-minutes: 75
        env:
          PALIMPSEST_TRAILER: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          # No sound card: OpenAL's null device still lets the game start (and log) every sound.
          ALSOFT_DRIVERS: "null"
        run: |
          chmod +x gradlew
          set -o pipefail
          mkdir -p run/config
          echo "earlyWindowControl = false" > run/config/fml.toml
          timeout -k 30 4400 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain < /dev/null 2>&1 | tee client.log
          grep -q "PALIMPSEST TRAILER COMPLETE" client.log

      - name: Summarise
        if: always()
        run: |
          grep -E "\[trailer\]|TRAILER_FAIL|ERROR|Exception|OpenAL|sound" client.log | grep -v "^\s*at " | head -400 || true
          if [ -d run/crash-reports ]; then head -c 20000 run/crash-reports/*; fi

      - name: Mix and grade
        run: python3 tools/trailer_mix.py run/trailer docs/trailer

      - name: Commit the video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/trailer
          git commit -m "Trailer: render from ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check generated resources against Java registries
        run: python3 tools/check.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      - name: Summarise compiler errors
        if: failure()
        run: |
          grep -E "error:|What went wrong|Could not|Exception" -A4 build.log | head -400 || true

      - name: Game tests (dedicated server, all worldgen and data loaded)
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log

      - name: Summarise game test output
        if: always()
        run: |
          grep -E "ERROR|WARN.*palimpsest|Exception|failed|passed|GameTest|tests" gametest.log | grep -v "^\s*at " | head -300 || true

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palimpsest
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: run/logs/
          if-no-files-found: ignore

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check generated resources against Java registries
        run: python3 tools/check.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --console=plain

      - name: Game tests (dedicated server, all worldgen and data loaded)
        run: ./gradlew runGameTestServer --console=plain

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palimpsest
          path: build/libs/*.jar
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: run/logs/
          if-no-files-found: ignore
